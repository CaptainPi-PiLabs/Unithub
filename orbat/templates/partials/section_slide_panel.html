{% extends "partials/base_slide_panel.html" %}

{% block slidePanel %}

<!-- Slot Template -->
<template x-if="panelMode === 'slots'">
  <div>
    <form method="POST" action="{% url 'orbat_section_slot_save' section.slug %}">
      {% csrf_token %}
      <input type="hidden" name="slot_id" x-model="activeSlot.id">

      <!-- Name -->
      <div class="mb-4">
        <label class="block font-semibold mb-1">Slot Name</label>
        <template x-if="canManageSlots">
          <input type="text" name="name" x-model="activeSlot.name"
                 class="w-full p-2 border rounded border-gray-300 focus:ring focus:ring-blue-300"
                 required>
        </template>
        <template x-if="!canManageSlots">
          <p x-text="activeSlot.name" class="p-2 bg-gray-100 rounded"></p>
        </template>
      </div>

      <!-- Colour -->
      <div class="mb-4">
        <label class="block font-semibold mb-1">Colour</label>
        <template x-if="canManageSlots">
          <select name="colour" x-model="activeSlot.colour"
                  class="w-full p-2 border rounded border-gray-300 focus:ring focus:ring-blue-300">
            <option value="">-</option>
            <option>Gold</option>
            <option>Green</option>
            <option>Blue</option>
            <option>Red</option>
          </select>
        </template>
        <template x-if="!canManageSlots">
          <p x-text="activeSlot.colour || '—'" class="p-2 bg-gray-100 rounded"></p>
        </template>
      </div>

      <!-- Assigned Member -->
      <div class="mb-4">
        <label class="block font-semibold mb-1">Assigned Member</label>
        <template x-if="canManageSlots">
          <select name="user_id" x-model="activeSlot.user_id"
                  class="w-full p-2 border rounded border-gray-300 focus:ring focus:ring-blue-300">
            <option value="">— Unassigned —</option>
            <template x-for="m in members" :key="m.id">
              <option :value="m.id" x-text="m.name"></option>
            </template>
          </select>
        </template>
        <template x-if="!canManageSlots">
          <p x-text="members.find(m => m.id === activeSlot.user_id)?.name || '—'" class="p-2 bg-gray-100 rounded"></p>
        </template>
      </div>

      <!-- Rank -->
      <div class="mb-4">
        <label class="block font-semibold mb-1">Rank</label>
        <template x-if="canManageSlots">
          <select name="rank_id" x-model="activeSlot.rank_id"
                  class="w-full p-2 border rounded border-gray-300 focus:ring focus:ring-blue-300">
            <option value="">PVT</option>
            <template x-for="r in rankRoles" :key="r.id">
              <option :value="r.id" x-text="r.name" :disabled="r.disabled"></option>
            </template>
          </select>
        </template>
        <template x-if="!canManageSlots">
          <p x-text="rankRoles.find(r => r.id === activeSlot.rank_id)?.name || 'PVT'" class="p-2 bg-gray-100 rounded"></p>
        </template>
      </div>

      <!-- Roles -->
      <div class="mb-4">
        <span class="block font-semibold mb-1">Additional Roles</span>
        <template x-if="canManageSlots">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
            <template x-for="r in nonRankRoles" :key="r.id">
              <label class="flex items-center space-x-2">
                <input type="checkbox" name="role_ids" :value="r.id"
                       :checked="activeSlot.role_ids.includes(r.id)"
                       :disabled="r.disabled"
                       class="rounded border-gray-300 focus:ring focus:ring-blue-300">
                <span x-text="r.name"></span>
              </label>
            </template>
          </div>
        </template>
        <template x-if="!canManageSlots">
          <ul class="space-y-1">
            <template x-for="r in nonRankRoles" :key="r.id">
              <li x-text="r.name" class="p-2 bg-gray-100 rounded"></li>
            </template>
          </ul>
        </template>
      </div>

      <!-- Description -->
      <div class="mb-4">
        <label class="block font-semibold mb-1">Description</label>
        <template x-if="canManageSlots">
          <textarea name="description" x-model="activeSlot.description"
                    class="w-full p-2 border rounded border-gray-300 focus:ring focus:ring-blue-300" rows="3"></textarea>
        </template>
        <template x-if="!canManageSlots">
          <p x-text="activeSlot.description || '—'" class="p-2 bg-gray-100 rounded"></p>
        </template>
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-end space-x-2 mt-6">
        <template x-if="canManageSlots">
          <button type="submit"
                  class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
            Save
          </button>
        </template>
          <button type="button"
                x-show="canManageSlots && activeSlot.id"
                @click="if(confirm('Remove this slot?')) window.location.href=`{% url 'orbat_section_slot_remove' section.slug %}?slot_id=${activeSlot.id}`"
                class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600">
              Remove
          </button>

        <button type="button" @click="panelOpen=false"
                class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">Close</button>
      </div>
    </form>
  </div>
</template>

<template x-if="panelMode === 'loa'">
    <form>
        <!-- LOA form fields -->
        <div class="mt-4 flex justify-end gap-2">
      <button @click="submitRoles()" class="px-4 py-2 bg-blue-500 text-white rounded">
        Save
      </button>
      <button @click="panelOpen = false" class="px-4 py-2 bg-gray-300 rounded">
        Cancel
      </button>
    </div>
    </form>
</template>

<template x-if="panelMode === 'join'">
    <form>
        <button type="submit" class="bg-green-500 px-4 py-2 rounded text-white">Submit</button>
        <button type="button" @click="panelOpen = false" class="ml-2 px-4 py-2 rounded border">Cancel</button>
    </form>
</template>

<template x-if="panelMode === 'leave'">
    <form>
        <!-- Leave section fields -->
    </form>
</template>

<template x-if="panelMode === 'section_management'">
    <div>
        <!-- Management controls -->
    </div>
</template>


{% endblock %}
