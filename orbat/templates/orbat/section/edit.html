{% extends "common/base.html" %}

{% block content %}
<div x-data="sectionEditPage()" class="max-w-5xl">

<form method="POST">
{% csrf_token %}

<!-- ================= Section Details ================= -->
<div class="mb-6">
    <h1 class="text-xl font-semibold mb-4">Edit Section</h1>

    <div class="space-y-4">
        <div>
            <label class="block text-sm font-medium mb-1">Section Name</label>
            {{ form.name }}
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Description</label>
            {{ form.description }}
        </div>
    </div>
</div>


<!-- ================= Slots ================= -->
<div class="mb-6">
<h3 class="text-lg font-semibold mb-2">Slots</h3>

<table class="min-w-full border-collapse">
<thead>
<tr class="bg-base-surface-dark">
    <th class="px-3 py-2 w-10"></th>
    <th class="px-4 py-2 text-left">Slot Name</th>
    <th class="px-4 py-2 text-left">Colour</th>
    <th class="px-4 py-2 text-left">Rank</th>
</tr>
</thead>

<tbody id="slot-list">

{% for slot in slots %}
<tr class="border-base-border" data-slot-id="{{ slot.id }}">

    <!-- Drag handle -->
    <td class="px-3 py-2 cursor-move text-gray-400">
        ☰
    </td>

    <!-- Slot name -->
    <td class="px-4 py-2">
        <input
            type="text"
            name="slots[{{ slot.id }}][name]"
            value="{{ slot.name }}"
            class="w-full input"
        >
    </td>

    <!-- Colour -->
    <td class="px-4 py-2">
        <select name="slots[{{ slot.id }}][colour]" class="w-full input">
            {% for value,label in colour_choices %}
                <option value="{{ value }}"
                {% if slot.colour == value %}selected{% endif %}>
                    {{ label }}
                </option>
            {% endfor %}
        </select>
    </td>

    <!-- Rank -->
    <td class="px-4 py-2">
        <select name="slots[{{ slot.id }}][rank]" class="w-full input">
            {% for value,label in rank_choices %}
                <option value="{{ value }}"
                {% if slot.rank == value %}selected{% endif %}>
                    {{ label }}
                </option>
            {% endfor %}
        </select>
    </td>

</tr>
{% endfor %}

</tbody>
</table>
</div>


<!-- ================= Actions ================= -->
<div class="flex gap-3 mt-6">

    <button type="submit"
        class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
        Save
    </button>

    <a href="{% url 'orbat_section_detail' section.slug %}"
       class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">
        Cancel
    </a>

</div>

</form>
</div>
{% endblock %}
