{% extends "common/partials/base_slide_panel.html" %}

{% block slidePanel %}

<!-- Slot Template -->
<template x-if="panelMode === 'slots'">
    <form
        method="POST"
        x-ref="slotForm"
        @submit="setAction()"
    >
        {% csrf_token %}
        <h2 class="text-lg font-semibold mb-4" x-text="activeSlot.id ? 'Edit Slot' : 'New Slot'"></h2>

        <!-- Slot Name -->
        <div class="mb-2">
            <label for="name" class="block font-semibold mb-1" x-show="canManageSlots">Slot Name</label>
            <input id="name" name="name" type="text" x-model="activeSlot.name" class="w-full p-2 bg-base-bg text-base-text border rounded" required x-show="canManageSlots">

            <!-- Show readonly if can't manage -->
            <p x-text="activeSlot.name || '—'" class="p-2 bg-base-bg text-base-text rounded" x-show="!canManageSlots"></p>
        </div>

        <!-- Slot Colour -->
        <div class="mb-4">
            <label class="block font-semibold mb-1">Colour</label>
            <template x-if="canManageSlots">
                <select name="colour" x-model="activeSlot.colour" class="w-full p-2 border rounded bg-base-bg text-base-text focus:ring focus:ring-blue-300">
                    <option value="">-</option>
                    <option>Gold</option>
                    <option>Green</option>
                    <option>Blue</option>
                    <option>Red</option>
                </select>
            </template>
            <template x-if="!canManageSlots">
                <p x-text="activeSlot.colour || '—'" class="p-2 bg-base-bg text-base-text rounded"></p>
            </template>
        </div>

        <!-- Officer -->
        <div class="mb-4">
            <label class="block font-semibold mb-1">Officer</label>

            <template x-if="canManageSlots">
                <input
                    type="checkbox"
                    name="is_officer"
                    x-model="activeSlot.is_officer"
                    class="h-4 w-4"
                >
            </template>

            <template x-if="!canManageSlots">
                <p class="p-2 bg-base-bg text-base-text rounded"
                   x-text="activeSlot.is_officer ? 'Yes' : 'No'">
                </p>
            </template>
        </div>

        <!-- Member Show Only -->
        <div class="mb-4">
            <p x-text="activeSlot.user_display_name || '-'" class="p-2 bg-base-bg text-base-text rounded"></p>
        </div>

        <div class="flex justify-end gap-2">
            <template x-if="canManageSlots">
                <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded">Save</button>
            </template>
            <button type="button" @click="closePanel()" class="px-4 py-2 bg-base-surface-dark text-base-text rounded">Close</button>
        </div>

    </form>
</template>

<template x-if="panelMode === 'loa'">
    <form>
        <!-- LOA form fields -->
        <div class="mt-4 flex justify-end gap-2">
      <button @click="submitRoles()" class="px-4 py-2 bg-blue-500 text-white rounded">
        Save
      </button>
      <button @click="panelOpen = false" class="px-4 py-2 bg-gray-300 rounded">
        Cancel
      </button>
    </div>
    </form>
</template>

<template x-if="panelMode === 'join'">
    <form>
        <button type="submit" class="bg-green-500 px-4 py-2 rounded text-white">Submit</button>
        <button type="button" @click="panelOpen = false" class="ml-2 px-4 py-2 rounded border">Cancel</button>
    </form>
</template>

<template x-if="panelMode === 'leave'">
    <form>
        <!-- Leave section fields -->
    </form>
</template>

<template x-if="panelMode === 'section_management'">
    <div>
        <!-- Management controls -->
    </div>
</template>


{% endblock %}
