{% extends "common/partials/base_slide_panel.html" %}

{% block slidePanel %}

<template x-if="isPanel('user_edit')">
    <div>
        <h2 class="text-lg font-semibold mb-4"
            x-text="formData.user_id ? 'Edit User' : 'Create User'">
        </h2>
        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="action" value="save_user">
            <input type="hidden" name="user_id" x-model="formData.user_id">
            <div class="mb-4">
                <label class="block font-semibold mb-1">Name</label>
                <input type="text" name="name" x-model="formData.name"
                       class="w-full p-2 border rounded border-base-border bg-base-surface text-base-text"
                       required>
            </div>
            <div class="flex justify-end space-x-2">
                {% if can_deny %}
                <template x-if="formData.user_id">
                    <button
                        type="submit"
                        name="action"
                        value="delete_user"
                        onclick="return confirm('Delete this user?')"
                        class="px-4 py-2 bg-red-600 text-white rounded">
                        Delete
                    </button>
                </template>
                {% endif %}
                <button type="button"
                        @click="closePanel()"
                        class="px-4 py-2 bg-base-surface-dark rounded">
                    Cancel
                </button>

                <button type="submit"
                        class="px-4 py-2 bg-blue-600 text-white rounded"
                        x-text="formData.user_id ? 'Save' : 'Create'">
                </button>
            </div>
        </form>
    </div>
</template>

<template x-if="isPanel('app_edit')">
    <div>
        <h2 class="text-lg font-semibold mb-4">Edit Application</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="action" value="save_application">
            <div class="mb-4">
                <label class="block font-semibold mb-1">Teamspeak ID</label>
                <input type="number" name="teamspeak_id" x-model="formData.teamspeak_id"
                       class="w-full p-2 border rounded border-base-border bg-base-surface text-base-text">
            </div>
            <div class="mb-4">
                <label class="block font-semibold mb-1">Over 18</label>
                <input type="checkbox" name="over_18" x-model="formData.over_18"
                       class="w-full p-2 border rounded border-base-border bg-base-surface text-base-text">
            </div>
            <div class="flex justify-end space-x-2">
                <button type="button"
                        @click="closePanel()"
                        class="px-4 py-2 bg-base-surface-dark rounded">
                    Cancel
                </button>

                <button type="submit"
                        class="px-4 py-2 bg-blue-600 text-white rounded">
                    Create
                </button>
            </div>
        </form>
    </div>
</template>

<template x-if="isPanel('deny')">
    <div>
        <h2 class="text-lg font-semibold mb-4">Deny Application</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="action" value="deny_application">
            <div class="mb-4">
                <label class="block font-semibold mb-1">Reason</label>
                <input type="text" name="reason"
                       class="w-full p-2 border rounded border-base-border bg-base-surface text-base-text"
                       required>
            </div>
            <div class="flex justify-end space-x-2">
                <button type="button"
                        @click="closePanel()"
                        class="px-4 py-2 bg-base-surface-dark rounded">
                    Cancel
                </button>

                <button type="submit"
                        class="px-4 py-2 bg-blue-600 text-white rounded">
                    Submit
                </button>
            </div>
        </form>
    </div>
</template>

<template x-if="isPanel('approve')">
    <div>
        <h2 class="text-lg font-semibold mb-4">Approve Application</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="action" value="approve_application">
            <div class="flex justify-end space-x-2">
                <button type="button"
                        @click="closePanel()"
                        class="px-4 py-2 bg-base-surface-dark rounded">
                    Cancel
                </button>

                <button type="submit"
                        class="px-4 py-2 bg-blue-600 text-white rounded">
                    Submit
                </button>
            </div>
        </form>
    </div>
</template>

<template x-if="isPanel('questionnaire')">
    <div>
        <h2 class="text-lg font-semibold mb-4">Questionnaire</h2>

        {% if focused_application.questionnaire %}
            <div class="space-y-4">

                <div>
                    <div class="font-semibold">Preferred Display Name</div>
                    <div>
                        {% if focused_application.questionnaire.preferred_display_name %}
                            {{ focused_application.questionnaire.preferred_display_name }}
                        {% else %}
                            -
                        {% endif %}
                    </div>
                </div>

                <div>
                    <div class="font-semibold">Owns Arma 3</div>
                    <div>
                        {% if focused_application.questionnaire.owns_arma3 == True %}
                            Yes
                        {% elif focused_application.questionnaire.owns_arma3 == False %}
                            No
                        {% else %}
                            -
                        {% endif %}
                    </div>
                </div>

                <div>
                    <div class="font-semibold">Birth Year</div>
                    <div>
                        {% if focused_application.questionnaire.birth_year %}
                            {{ focused_application.questionnaire.birth_year }}
                            (Age: {{ questionnaire_age }})
                        {% else %}
                            -
                        {% endif %}
                    </div>
                </div>

                <div>
                    <div class="font-semibold">Timezone</div>
                    <div>{{ focused_application.questionnaire.timezone|default:"-" }}</div>
                </div>

                <div>
                    <div class="font-semibold">Used TFAR</div>
                    <div>
                        {% if focused_application.questionnaire.has_used_tfar == True %}
                            Yes
                        {% elif focused_application.questionnaire.has_used_tfar == False %}
                            No
                        {% else %}
                            -
                        {% endif %}
                    </div>
                </div>

                <div>
                    <div class="font-semibold">Used ACE</div>
                    <div>
                        {% if focused_application.questionnaire.has_used_ace == True %}
                            Yes
                        {% elif focused_application.questionnaire.has_used_ace == False %}
                            No
                        {% else %}
                            -
                        {% endif %}
                    </div>
                </div>

                <div>
                    <div class="font-semibold">Seriousness Ranking</div>
                    <div>{{ focused_application.questionnaire.seriousness_ranking|default:"-" }}/10</div>
                </div>

                <div>
                    <div class="font-semibold">Areas of Interest</div>
                    <ul class="list-disc list-inside">
                        {% for interest in focused_application.questionnaire.areas_of_interest.all %}
                            <li>{{ interest.name }}</li>
                        {% empty %}
                            <li>-</li>
                        {% endfor %}
                    </ul>
                </div>

                <div>
                    <div class="font-semibold">Referral Source</div>
                    <div>{{ focused_application.questionnaire.referral_source|default:"-" }}</div>
                </div>

                <div>
                    <div class="font-semibold">Previous Groups</div>
                    <div class="whitespace-pre-wrap">{{ focused_application.questionnaire.previous_groups|default:"-" }}</div>
                </div>

            </div>
        {% else %}
            <p>No questionnaire has been submitted.</p>
        {% endif %}

        <div class="flex justify-end mt-6">
            <button
                type="button"
                @click="closePanel()"
                class="px-4 py-2 bg-base-surface-dark rounded"
            >
                Close
            </button>
        </div>
    </div>
</template>

{% endblock %}
