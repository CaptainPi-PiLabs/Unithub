{% extends "common/base.html" %}

{% block content %}

<form id="member-filters"
      hx-get="."
      hx-target="#members-table"
      hx-trigger="keyup changed delay:300ms from:input"
      class="flex flex-wrap items-center gap-4 mb-4">

    <!-- Status dropdown on the left -->
    <select name="status"
            hx-get="."
            hx-trigger="change"
            hx-target="#members-table"
            hx-include="#member-filters"
            class="p-2 rounded bg-base-bg text-base-text border border-base-border min-w-[180px]">
        <option value="">All Active</option>
        <option value="section_member">Section Member</option>
        <option value="active_delta">Active Delta</option>
        <option value="delta_reserve">Delta Reserve</option>
        <option value="prospective">Prospective</option>
        <option value="junior">Junior Operator</option>
        <option value="operator">Operator</option>
        <option value="veteran">Veteran Operator</option>
        <option value="loa">On LOA</option>
        <option value="retired">Retired</option>
    </select>

    <!-- Search box on the right -->
    <input type="text"
           name="search"
           placeholder="Search members..."
           class="px-2 py-1.5 bg-base-bg text-base-text border border-base-border rounded flex-1 min-w-[200px]">
</form>

<div class="overflow-x-auto max-w-6xl mx-auto">
    <table class="min-w-full border-collapse table-fixed">
        <thead class="bg-base-surface-dark border-b border-base-border text-base-text text-left">
            <tr>
                <th><a class="px-4 py-2" hx-get="." hx-target="#members-table" hx-include="#member-filters" hx-vals='{"sort":"rank"}' href="#">Rank</a></th>
                <th><a class="px-4 py-2" hx-get="." hx-target="#members-table" hx-include="#member-filters" hx-vals='{"sort":"name"}' href="#">Name</a></th>
                <th><a class="px-4 py-2" hx-get="." hx-target="#members-table" hx-include="#member-filters" hx-vals='{"sort":"section"}' href="#">Section</a></th>
                <th><a class="px-4 py-2" hx-get="." hx-target="#members-table" hx-include="#member-filters" hx-vals='{"sort":"membership"}' href="#">Membership</a></th>
                <th><a class="px-4 py-2" hx-get="." hx-target="#members-table" hx-include="#member-filters" hx-vals='{"sort":"status"}' href="#">Status</a></th>
            </tr>
        </thead>
        <tbody id="members-table" class="bg-base-surface text-base-text">
            {% include "orbat/partials/members_table.html" %}
        </tbody>
    </table>
</div>

{% endblock %}
