{% extends "common/base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">New Qualification</h1>

<form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
        {{ form.name.label_tag }}
        {{ form.name }}
    </div>
    <div>
        {{ form.description.label_tag }}
        {{ form.description }}
    </div>
    <div class="flex items-center gap-2">
        {{ form.is_active }} {{ form.is_active.label_tag }}
    </div>

    <button type="submit"
            class="px-4 py-2 bg-base-accent text-white rounded hover:opacity-90 mt-4">
        Create
    </button>
</form>
{% endblock %}
