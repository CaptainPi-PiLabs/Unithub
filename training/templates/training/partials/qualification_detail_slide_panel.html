{% extends "common/partials/base_slide_panel.html" %}

{% block slidePanel %}

<!-- ========================= -->
<!-- DETAILS PANEL -->
<!-- ========================= -->
<template x-if="panelMode === 'details'">
  <form method="POST" action="{% url 'training_qualification_save' qualification.pk %}">
    {% csrf_token %}

    <h2 class="text-lg font-semibold mb-4">Qualification Details</h2>

    <!-- Name -->
    <div class="mb-4">
      <label class="block font-semibold mb-1">Name</label>

      {% if can_edit %}
        <input type="text" name="name" value="{{ qualification.name }}" class="w-full p-2 border rounded bg-base-bg text-base-text focus:ring focus:ring-blue-300" required>
      {% else %}
        <p class="p-2 bg-gray-100 rounded">{{ qualification.name }}</p>
      {% endif %}
    </div>

    <!-- Description -->
    <div class="mb-4">
      <label class="block font-semibold mb-1">Description</label>

      {% if can_edit %}
        <textarea name="description" rows="4" class="w-full p-2 border rounded bg-base-bg text-base-text focus:ring focus:ring-blue-300">{{ qualification.description }}</textarea>
      {% else %}
        <p class="p-2 bg-gray-100 rounded whitespace-pre-line">
          {{ qualification.description|default:"—" }}
        </p>
      {% endif %}
    </div>

    <!-- Actions -->
    <div class="flex justify-end space-x-2 mt-6">
      {% if can_edit %}
        <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
          Save
        </button>
          <form method="POST"
                action="{% url 'training_qualification_remove' qualification.pk %}"
                x-data
                @submit.prevent="
                  if (confirm('Are you sure you want to delete this qualification?')) {
                    $el.submit();
                  }
                ">
            {% csrf_token %}
            <button type="submit"
                    class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600">
              Delete
            </button>
          </form>
      {% endif %}

      <button type="button" @click="panelOpen = false" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">
        Close
      </button>
    </div>
  </form>
</template>

<!-- ========================= -->
<!-- CRITERIA PANEL -->
<!-- ========================= -->
<template x-if="panelMode === 'criteria'">
  <div>
    <h2 class="text-lg font-semibold mb-4" x-text="activeCriterion.id ? 'Edit Criterion' : 'New Criterion'"></h2>

    <form method="post" action="{% url 'training_qualification_criterion_save' qualification.id %}">
      {% csrf_token %}
      <input type="hidden" name="criterion_id" x-model="activeCriterion.id">

      <!-- Name -->
      <div class="mb-4">
        <label class="block font-semibold mb-1">Name</label>
        <input type="text" name="name" x-model="activeCriterion.name" class="w-full p-2 bg-base-bg text-base-text border rounded" required>
      </div>

      <!-- Description -->
      <div class="mb-4">
        <label class="block font-semibold mb-1">Description</label>
        <textarea name="description" x-model="activeCriterion.description" rows="4" class="w-full p-2 bg-base-bg text-base-text border rounded"></textarea>
      </div>

      <!-- Actions -->
      <div class="flex justify-end space-x-2">
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded">
          Save
        </button>
        <form method="POST"
              :action="`{% url 'training_qualification_criterion_remove' qualification.pk %}`"
              x-show="activeCriterion.id"
              @submit.prevent="$el.submit()">
          {% csrf_token %}
          <input type="hidden" name="criterion_id" :value="activeCriterion.id">

          <button type="submit"
                  @click="if(!confirm('Remove this criterion?')) $event.preventDefault()"
                  class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600">
            Remove
          </button>
        </form>

        <button type="button" @click="panelOpen = false" class="px-4 py-2 bg-base-surface-dark text-base-text rounded">
          Cancel
        </button>
      </div>
    </form>
  </div>
</template>

<!-- ========================= -->
<!-- TRAINERS PANEL -->
<!-- ========================= -->
<template x-if="panelMode === 'trainers'">
  <div>
    <h2 class="text-lg font-semibold mb-4">Trainers</h2>

    <div class="space-y-3 mb-6">
      {% for trainer in trainers %}
      <div class="flex justify-between items-center p-3 border rounded bg-base-surface-dark">
        <div>
          <p class="font-semibold">{{ trainer.user.display_name }}</p>
          <p class="text-sm text-gray-400">
            {{ trainer.role|default:"Trainer" }}
          </p>
        </div>

        {% if can_manage_trainers %}
        <button class="text-sm text-blue-500" @click="activeTrainer = {{ trainer.id }}; panelMode = 'trainer_edit'">
          Edit
        </button>
        {% endif %}
      </div>
      {% endfor %}
    </div>

    {% if can_manage_trainers %}
    <button @click="panelMode = 'trainer_invite'" class="px-4 py-2 bg-green-600 text-base-text rounded">
      Invite Trainer
    </button>
    {% endif %}

    <div class="flex justify-end mt-6">
      <button type="button" @click="panelOpen = false" class="px-4 py-2 bg-base-surface-dark text-base-text rounded">
        Close
      </button>
    </div>
  </div>
</template>

{% endblock %}
