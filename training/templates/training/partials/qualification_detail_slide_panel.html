{% extends "common/partials/base_slide_panel.html" %}

{% block slidePanel %}

<!-- ========================= -->
<!-- DETAILS PANEL -->
<!-- ========================= -->
<template x-if="isPanel('details')">
<div>

    <h2 class="text-lg font-semibold mb-4">Qualification Details</h2>

    <form method="POST">
        {% csrf_token %}

        <!-- Name -->
        <div class="mb-4">
            <label class="block font-semibold mb-1">Name</label>

            <input
                type="text"
                name="name"
                value="{{ qualification.name }}"
                {% if not can_edit %}disabled{% endif %}
                class="w-full p-2 border rounded bg-base-bg text-base-text">
        </div>

        <!-- Description -->
        <div class="mb-4">
            <label class="block font-semibold mb-1">Description</label>

            {% if can_edit %}
            <textarea
                name="description"
                rows="4"
                class="w-full p-2 border rounded bg-base-bg text-base-text">
{{ qualification.description }}</textarea>

            {% else %}
            <p class="p-2 bg-gray-100 rounded whitespace-pre-line">
                {{ qualification.description|default:"—" }}
            </p>
            {% endif %}
        </div>

        <!-- Actions -->
        <div class="flex justify-end space-x-2 mt-6">
            {% if can_edit %}
            <button type="submit"
                    name="action"
                    value="delete_qualification"
                    onclick="return confirm('Remove this qualification?')"
                    class="px-4 py-2 bg-red-500 text-white rounded">
                Delete
            </button>
            {% endif %}

            <button type="button"
                    @click="closePanel()"
                    class="px-4 py-2 bg-base-surface-dark rounded">
                Close
            </button>

            {% if can_edit %}
            <button type="submit"
                    name="action"
                    value="save_qualification"
                    class="px-4 py-2 bg-blue-600 text-white rounded">
                Save
            </button>
            {% endif %}
        </div>

    </form>

</div>
</template>


<!-- ========================= -->
<!-- CRITERIA PANEL -->
<!-- ========================= -->
<template x-if="isPanel('criteria')">
<div>

    <h2 class="text-lg font-semibold mb-4" x-text="formData.id ? 'Edit Criterion' : 'New Criterion'"></h2>

    <form method="POST">

        {% csrf_token %}
        <input type="hidden" name="criterion_id" x-model="formData.id">

        <!-- Name -->
        <div class="mb-4">
            <label class="block font-semibold mb-1">Name</label>

            <input type="text"
                   name="name"
                   x-model="formData.name"
                   required
                   class="w-full p-2 border rounded bg-base-bg text-base-text">
        </div>

        <!-- Description -->
        <div class="mb-4">
            <label class="block font-semibold mb-1">Description</label>

            <textarea name="description"
                      x-model="formData.description"
                      rows="4"
                      class="w-full p-2 border rounded bg-base-bg text-base-text"></textarea>
        </div>

        <!-- Actions -->
        <div class="flex justify-end space-x-2">

            <template x-if="formData.id">
                <button type="submit"
                        name="action"
                        value="delete_criterion"
                        onclick="return confirm('Remove this criterion?')"
                        class="px-4 py-2 bg-red-500 text-white rounded">
                    Remove
                </button>
            </template>

            <button type="button"
                    @click="closePanel()"
                    class="px-4 py-2 bg-base-surface-dark rounded">
                Cancel
            </button>

            <button type="submit"
                    name="action"
                    value="save_criterion"
                    class="px-4 py-2 bg-blue-600 text-white rounded">
                Save
            </button>

        </div>

    </form>
</div>
</template>

<!-- ========================= -->
<!-- TRAINERS PANEL -->
<!-- ========================= -->
<template x-if="isPanel('trainer_select')">
<div>
    <h2 class="text-lg font-semibold mb-4">
        Select Trainer
    </h2>

    <div x-data="userSearch({ multiple: false })"
         x-init="$watch('search', () => performSearch())">

        <input
            type="text"
            x-model="search"
            @input.debounce.300ms="performSearch()"
            placeholder="Search users..."
            class="w-full p-2 border rounded
           bg-base-bg
           text-base-text
           border-base-border
           focus:ring focus:ring-blue-500">

        <div class="mt-2 border rounded max-h-60 overflow-y-auto">
            <template x-for="user in results" :key="user.id">

                <div
                    @click="$dispatch('trainer-user-selected', user)"
                    class="p-2 hover:bg-base-surface cursor-pointer">

                    <span x-text="user.name"></span>

                </div>

            </template>
        </div>

    </div>
</div>
</template>

<template x-if="isPanel('trainer_edit')">
<div>
    <h2 class="text-lg font-semibold mb-4" x-text="formData.id ? 'Edit Trainer' : 'Add Trainer'"></h2>
    <form method="POST">
        {% csrf_token %}

        <input type="hidden" name="user_id" x-model="formData.user_id">

        <!-- User Display (Read Only) -->
        <div class="mb-4">
            <label class="block font-semibold mb-1">User</label>

            <div class="p-3 border rounded bg-base-surface-dark">
                <span x-text="formData.name"></span>
            </div>
        </div>

        <!-- Role Dropdown -->
        <div class="mb-4">
            <label class="block font-semibold mb-1">Role</label>

            <select
                name="role"
                x-model="formData.role"
                class="w-full p-2 border rounded bg-base-bg text-base-text">

                <option value="Trainer">Trainer</option>
                <option value="Senior Trainer">Senior Trainer</option>
                <option value="Manager">Manager</option>

            </select>
        </div>

        <!-- Actions -->
        <div class="flex justify-end space-x-2">

            <!-- Remove -->
            <template x-if="formData.id">
                <button type="submit"
                        name="action"
                        value="remove_trainer"
                        onclick="return confirm('Remove this trainer?')"
                        class="px-4 py-2 bg-red-500 text-white rounded">
                    Remove
                </button>
            </template>

            <button type="button"
                    @click="closePanel()"
                    class="px-4 py-2 bg-base-surface-dark rounded">
                Cancel
            </button>

            <button type="submit"
                    name="action"
                    value="save_trainer"
                    class="px-4 py-2 bg-blue-600 text-white rounded">
                Save
            </button>
        </div>
    </form>
</div>
</template>

{% endblock %}
