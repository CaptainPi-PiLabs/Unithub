<!-- Backdrop -->
<div
    x-show="panelOpen"
    x-transition.opacity
    class="fixed inset-0 bg-black/50 z-40"
    @click="panelOpen = false"
    x-cloak
></div>

<!-- Slide panel -->
<div
    x-show="panelOpen"
    x-transition:enter="transition transform duration-300"
    x-transition:enter-start="translate-x-full"
    x-transition:enter-end="translate-x-0"
    x-transition:leave="transition transform duration-300"
    x-transition:leave-start="translate-x-0"
    x-transition:leave-end="translate-x-full"
    class="fixed top-0 right-0 h-full w-full md:w-1/3 bg-base-surface shadow-lg z-50 overflow-y-auto"
    @click.stop
    x-cloak
>
    <!-- Header -->
    <div class="flex items-center p-4 border-b border-base-border">
        <button @click="panelOpen = false" class="ml-auto text-base-muted text-xl leading-none" aria-label="Close">&times;</button>
    </div>

    <!-- Content -->
    <div class="p-4">
        {% block slidePanel %}{% endblock %}
    </div>
</div>
